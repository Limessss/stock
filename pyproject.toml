[project]
name = "stockmodel"
version = "0.1.0"
description = "A 股形态识别 + 回测可视化平台（个人单机版）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "stockmodel" }]
license = { text = "MIT" }

dependencies = [
    # 后端 / 服务层
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # 算法层
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    # 工具
    "python-dotenv>=1.0",
    "rich>=13.7",
    "akshare>=1.18.64",
    "httpx>=0.27",
    "openai>=1.40",
    "pypinyin>=0.53",
    "pytdx>=1.72",
]

[project.optional-dependencies]
# Phase 3 引入 VectorBT 时执行: uv sync --extra backtest
backtest = [
    "vectorbt>=0.26",
    "numba>=0.59",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",  # FastAPI 测试
]

[tool.uv]
# 国内镜像源（清华）
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "backend"]
